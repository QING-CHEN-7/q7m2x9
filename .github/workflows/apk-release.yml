name: apk-release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apk-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch apk (from home mirror)
        run: |
          set -euo pipefail
          curl -fkL --retry 5 --retry-delay 5 --max-time 3600 -o build.bin "https://189.24.79.93:9443/apk/mirror.apk"
          ls -l build.bin
          echo "SHA=$(sha256sum build.bin | cut -d' ' -f1)" | tee -a "$GITHUB_ENV"
      - name: publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete v1.36.6 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.36.6 build.bin \
            --repo "${{ github.repository }}" \
            --title "1.36.6" \
            --notes "sha256: $SHA"
          gh release view v1.36.6 --repo "${{ github.repository }}" --json url,assets -q '.url'